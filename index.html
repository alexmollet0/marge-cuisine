<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installation sur l'écran d'accueil (2026-08-23) — manifest + icônes générées depuis la
         même silhouette que favicon.svg (voir scripts/gen-icons.ps1), pas de service worker : ça
         suffit pour "Ajouter à l'écran d'accueil" en plein écran sur iOS/Android, sans le chantier
         supplémentaire (et le risque non testable en local) d'un vrai mode hors-ligne. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1B1815" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chefup" />
    <!-- [SEO + HONNÊTETÉ, 2026-11-19] Avant : titre « Chefup » seul (ne dit pas ce que c'est) et descriptions « sans carte bancaire »
         (faux du 2026-11-18 au 2026-11-19 : la carte était demandée à l'inscription ; l'essai est de nouveau sans carte depuis le 2026-11-19). Un spectateur a
         aussi écrit que « Getchefup » sur Google ne mène presque jamais au site. Ici : un titre et une description qui disent ce
         que fait Chefup, aucune promesse sur la carte, une adresse canonique, des données structurées (sans aucun avis) et un
         texte lisible sans JavaScript (<noscript>). robots.txt et sitemap.xml sont dans public/. -->
    <title>Chefup — calcule la marge de chaque plat de ton restaurant</title>
    <meta name="description" content="Prends tes factures fournisseurs en photo : Chefup lit les prix et recalcule la marge de chacun de tes plats. Pour les restaurateurs. Essai gratuit 7 jours, sans carte bancaire." />
    <link rel="canonical" href="https://getchefup.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chefup" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Chefup — calcule la marge de chaque plat de ton restaurant" />
    <meta property="og:description" content="Prends tes factures fournisseurs en photo : Chefup lit les prix et recalcule la marge de chacun de tes plats. Essai gratuit 7 jours, sans carte bancaire." />
    <meta property="og:url" content="https://getchefup.com/" />
    <!-- [2026-11-19] Image d'aperçu quand on partage le lien (WhatsApp, Messenger, LinkedIn, SMS…) : 1200 x 630, ~80 Ko. Générée par
         scripts/og-image/ (voir render.cjs) ; si le texte de l'image change, la régénérer puis remplacer public/og-image.jpg. -->
    <meta property="og:image" content="https://getchefup.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chefup : le calcul de marge pour les restaurateurs. Essai gratuit 7 jours, sans carte bancaire." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://getchefup.com/og-image.jpg" />
    <meta name="twitter:title" content="Chefup — calcule la marge de chaque plat de ton restaurant" />
    <meta name="twitter:description" content="Prends tes factures fournisseurs en photo : Chefup lit les prix et recalcule la marge de chacun de tes plats. Essai gratuit 7 jours, sans carte bancaire." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Chefup",
        "url": "https://getchefup.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "Application de calcul de marges pour les restaurateurs : lecture des factures fournisseurs en photo, marge de chaque plat, fiches techniques et allergènes, carte digitale avec QR code.",
        "inLanguage": ["fr", "es", "en"],
        "offers": { "@type": "Offer", "price": "49", "priceCurrency": "EUR", "description": "Abonnement mensuel, essai gratuit 7 jours sans carte bancaire" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Chefup — calcule la marge de chaque plat de ton restaurant</h1>
      <p>Prends tes factures fournisseurs en photo : Chefup lit les prix et recalcule la marge de chacun de tes plats. Pour les restaurateurs. Essai gratuit 7 jours, sans carte bancaire. Cette page a besoin de JavaScript pour s'afficher.</p>

    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
